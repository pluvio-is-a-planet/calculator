<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator-style.css">
    <script src="calculator.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator-container">
        <div class="output-container">
            <div class="history-output-container"></div>
            <div class="result-output-container"></div>
        </div>
        <div class="input-container">
            <div class="number-input-container">
                <div class="first-row row-container">
                    <button class="number-input input" value="1">1</button>
                    <button class="number-input input" value="2">2</button>
                    <button class="number-input input" value="3">3</button>
                </div>
                <div class="second-row row-container">
                    <button class="number-input input" value="4">4</button>
                    <button class="number-input input" value="5">5</button>
                    <button class="number-input input" value="6">6</button>
                </div>
                <div class="third-row row-container">
                    <button class="number-input input" value="7">7</button>
                    <button class="number-input input" value="8">8</button>
                    <button class="number-input input" value="9">9</button>
                </div>
                <div class="fourth-row row-container">
                    <button class="number-input input" value="0">0</button>
                    <button class="number-input input" value=".">.</button>
                    <button class="evaluate input">=</button>
                </div>
            </div>
            <div class="operator-input-container">
                <button class="operator-input input" value="+">+</button>
                <button class="operator-input input" value="-">-</button>
                <button class="operator-input input" value="*">x</button>
                <button class="operator-input input" value="/">/</button>
            </div>
        </div>
    </div>
</body>
</html>
