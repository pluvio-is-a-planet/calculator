<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calculator-style.css">
    <script src="calculator.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator-container">
        <div class="output-container">
            <div class="history-output-container">
                
            </div>
            <div class="result-output-container">

            </div>
        </div>
        <div class="input-container">
            <div class="number-input-container">
                <button class="number-input" value="1">1</button>
                <button class="number-input" value="2">2</button>
                <button class="number-input" value="3">3</button>
                <button class="number-input" value="4">4</button>
                <button class="number-input" value="5">5</button>
                <button class="number-input" value="6">6</button>
                <button class="number-input" value="7">7</button>
                <button class="number-input" value="8">8</button>
                <button class="number-input" value="9">9</button>
                <button class="number-input" value="0">0</button>
                <button class="decimal-input" value=".">.</button>
                <button class="evaluate">=</button>
            </div>
            <div class="operator-input-container">
                <button class="operator-input" value="add">+</button>
                <button class="operator-input" value="subtract">-</button>
                <button class="operator-input" value="multiply">x</button>
                <button class="operator-input" value="divide">/</button>
            </div>
        </div>
    </div>
</body>
</html>
